name: Weekly Stock Screener v2

# Manual only — click "Run workflow" in the Actions tab.
# No schedule: this repo runs only when you ask it to.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener v2
        env:
          FINNHUB_API_KEY:   ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python screener_v2.py

      - name: Publish presentation variants
        run: python make_variants.py

      - name: Commit and push pages and archive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/v2out/docs /tmp/v2out/data
          cp -r docs/. /tmp/v2out/docs/ 2>/dev/null || true
          cp -r data/. /tmp/v2out/data/ 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs data
          cp -r /tmp/v2out/docs/. docs/ 2>/dev/null || true
          cp -r /tmp/v2out/data/. data/ 2>/dev/null || true
          git add docs data
          git diff --staged --quiet || git commit -m "v2 update: $(date +'%Y-%m-%d')"
          git push
